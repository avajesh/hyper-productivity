@if (isHideDone() || isHideAll()) {
  <div
    @expandFadeFast
    class="done-task-box"
  >
    <button
      (click)="expandDoneTasks()"
      class="expand-tasks-btn"
      mat-button
    >
      <span>
        @if (isHideDone()) {
          {{
            T.F.TASK.CMP.SHOW_HIDDEN_DONE_SUB_TASKS | translate: { nr: doneTasksLength() }
          }}
        } @else {
          {{ T.F.TASK.CMP.SHOW_HIDDEN_SUB_TASKS | translate: { nr: allTasksLength() } }}
        }
      </span>
      <mat-icon>expand_more</mat-icon>
    </button>
  </div>
}

@if (isZoomed()) {
  <div
    class="zoom-breadcrumb"
    style="
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      padding: 4px 0;
      flex-wrap: wrap;
    "
  >
    <button
      mat-button
      (click)="unzoom()"
      color="primary"
      style="padding: 0 8px; min-width: 0"
    >
      <mat-icon>format_list_bulleted</mat-icon>
      All tasks
    </button>
    <mat-icon style="opacity: 0.5; font-size: 18px; height: 18px; width: 18px"
      >chevron_right</mat-icon
    >
    <span style="font-weight: 500; opacity: 0.85; font-size: 0.9em">{{
      zoomedTaskTitle()
    }}</span>
  </div>
}

<div
  cdkDropList
  [cdkDropListConnectedTo]="dropListService.dropLists | async"
  [cdkDropListSortingDisabled]="isSortingDisabled()"
  [cdkDropListEnterPredicate]="enterPredicate"
  [cdkDropListData]="dropModelDataForList()"
  (cdkDropListDropped)="drop($event)"
  [attr.data-list-id]="listId()"
  [@taskList]="
    (dropListService.isBlockAniAfterDrop$ | async) ? 'BLOCK' : filteredTasks()?.length
  "
  [attr.data-id]="listModelId()"
  class="task-list-inner"
>
  @for (task of filteredTasks(); track trackByFn($index, task); let i = $index) {
    <task
      [isInSubTaskList]="isSubTaskList()"
      [isBacklog]="isBacklog()"
      [task]="task"
      cdkDrag
      [cdkDragStartDelay]="dragDelayForTouch()"
      [cdkDragLockAxis]="isXs() ? 'y' : ''"
      [cdkDragDisabled]="listModelId() === 'LATER_TODAY'"
      [cdkDragData]="task"
      (pointerdown)="onDragPointerDown(task, $event)"
      (cdkDragStarted)="onDragStarted(task, $event)"
      (cdkDragEnded)="onDragEnded()"
    >
    </task>
  }
</div>

@if (noTasksMsg() && !allTasksLength()) {
  <div class="no-tasks">{{ noTasksMsg() }}</div>
}
