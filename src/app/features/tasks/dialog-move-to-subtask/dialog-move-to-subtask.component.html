<h2 mat-dialog-title>
  <mat-icon class="dialog-header-icon">subdirectory_arrow_right</mat-icon>
  <span>Move under task</span>
</h2>

<mat-dialog-content>
  <p class="dialog-description">
    Select a target task to convert <strong>{{ data.task.title }}</strong> into a subtask.
  </p>

  <mat-form-field
    appearance="outline"
    class="search-field"
  >
    <mat-label>Search tasks</mat-label>
    <input
      matInput
      type="text"
      [ngModel]="searchTxt()"
      (ngModelChange)="searchTxt.set($event)"
      placeholder="Type to filter..."
      autofocus
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="candidates-list">
    @if (candidateTasks().length === 0) {
      <div class="empty-state">
        <mat-icon>inbox</mat-icon>
        <p>No eligible parent tasks found.</p>
      </div>
    } @else {
      @for (item of candidateTasks(); track item.task.id) {
        <button
          type="button"
          class="candidate-item"
          (click)="selectParent(item.task)"
        >
          <mat-icon class="candidate-icon">subdirectory_arrow_right</mat-icon>
          <div class="candidate-content">
            @if (item.breadcrumb) {
              <div class="candidate-breadcrumb">{{ item.breadcrumb }}</div>
            }
            <div class="candidate-title">{{ item.task.title }}</div>
          </div>
        </button>
      }
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="close()"
  >
    {{ T.G.CANCEL | translate }}
  </button>
</mat-dialog-actions>
